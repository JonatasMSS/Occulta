[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "face-blur"
version = "0.1.0"
description = "Anonimização seletiva de rostos com AdaFace IR-101"
requires-python = ">=3.11,<3.12"
dependencies = [
    "insightface",
    "numpy",
    "onnxruntime",
    "opencv-python",
    "torch",
    "tqdm",
]

[project.scripts]
face-blur = "face_blur.app:main"

[tool.setuptools.packages.find]
where = ["src"]
